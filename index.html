<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15191d"><title>FREE AI ROCK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:oklch(15% .018 250);--panel:oklch(20% .02 250);--panel2:oklch(24% .025 250);--line:oklch(35% .03 250);--text:oklch(93% .015 250);--muted:oklch(70% .025 250);--accent:oklch(76% .13 190);--danger:oklch(70% .16 28);--sans:'DM Sans',system-ui,sans-serif;--mono:'Space Mono',monospace}
[data-theme=light]{color-scheme:light;--bg:oklch(97% .012 190);--panel:oklch(100% .005 190);--panel2:oklch(94% .02 190);--line:oklch(82% .035 190);--text:oklch(22% .03 230);--muted:oklch(48% .035 230);--accent:oklch(55% .14 190)}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{height:100%;display:grid;grid-template-columns:296px 1fr}.sidebar{border-right:1px solid var(--line);padding:18px 15px;display:flex;flex-direction:column;gap:16px;background:var(--panel);backdrop-filter:blur(20px)}.brand{display:flex;justify-content:space-between;align-items:center;font-weight:700}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font:12px var(--mono);margin-right:8px}.icon,.ghost{min-width:42px;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted)}.icon:hover,.ghost:hover{background:var(--panel2);color:var(--text)}.new,.suggestion,.primary,.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel2);color:var(--text)}.new{font-weight:700}.new:hover,.suggestion:hover{border-color:var(--accent)}.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 11px}.search input{min-width:0;width:100%;padding:11px 0;border:0;outline:0;background:transparent;color:var(--text)}.history{overflow:auto}.chat{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:1px solid transparent;border-radius:11px;padding:10px;background:transparent;color:var(--muted)}.chat:hover,.chat.active{background:var(--panel2);color:var(--text);border-color:var(--line)}.chat span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.del{opacity:0}.chat:hover .del{opacity:1}.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}.settings{width:100%;border:0;background:transparent;color:var(--muted);padding:11px;text-align:left}.settings:hover{background:var(--panel2);color:var(--text)}.main{min-width:0;display:grid;grid-template-rows:74px 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,5vw,65px);border-bottom:1px solid var(--line);background:var(--panel)}.top h1{font-size:17px;margin:0}.left,.actions{display:flex;align-items:center;gap:10px}.model{color:var(--muted);font-size:13px}.model select,.field input,.field select{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);padding:9px}.messages{overflow:auto;padding:clamp(18px,5vw,70px) clamp(14px,8vw,120px) 28px}.empty{max-width:600px;margin:12vh auto;text-align:center}.eyebrow{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.empty h2{font-size:clamp(30px,5vw,54px);line-height:1;letter-spacing:-.06em;margin:16px 0}.empty p{color:var(--muted);line-height:1.6}.suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}.message{max-width:780px;margin:0 auto 28px;display:flex;gap:12px;animation:in .25s ease-out}.message.user{justify-content:flex-end}.avatar{width:32px;height:32px;display:grid;place-items:center;flex:none;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font:11px var(--mono)}.bubble{padding:14px 16px;line-height:1.65;border-radius:17px;overflow-wrap:anywhere}.user .bubble{background:var(--accent);color:oklch(18% .03 190);border-radius:17px 17px 4px 17px}.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-radius:17px 17px 17px 4px}.bubble pre{overflow:auto;padding:14px;border-radius:10px;background:var(--bg);font:13px var(--mono);white-space:pre-wrap}.bubble code{font-family:var(--mono);font-size:.9em}.tools{margin-top:5px}.tools button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 7px}.composer-wrap{padding:0 clamp(14px,8vw,120px) max(14px,env(safe-area-inset-bottom))}.status{min-height:20px;color:var(--muted);font-size:12px}.status.error{color:var(--danger)}.composer{max-width:780px;margin:auto;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:9px}.composer textarea{width:100%;min-height:54px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:8px;line-height:1.5}.composer-row{display:flex;align-items:center;justify-content:space-between}.hint{color:var(--muted);font-size:12px}.send{border:0;border-radius:11px;background:var(--accent);color:oklch(18% .03 190);padding:10px 14px;font-weight:700}.send.stop{background:var(--danger);color:oklch(18% .03 28)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:oklch(8% .02 250 / .7);z-index:4}.modal.open{display:grid}.dialog{width:min(620px,100%);max-height:90dvh;overflow:auto;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{font-size:22px}.group{border-top:1px solid var(--line);padding:16px 0}.field{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0}.field label{color:var(--muted);font-size:14px}.field input{min-width:240px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.primary{background:var(--accent);color:oklch(18% .03 190);font-weight:700}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:11px 14px;border-radius:11px;display:none}.toast.show{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:760px){.shell{display:block}.sidebar{position:fixed;z-index:3;inset:0 auto 0 0;width:min(320px,88vw);transform:translateX(-102%);transition:transform .25s}.sidebar.open{transform:none}.mobile{display:inline-grid}.model{display:none}.top{padding:0 13px}.messages{padding:24px 14px}.composer-wrap{padding:0 14px max(12px,env(safe-area-inset-bottom))}.top .actions .ghost{display:none}.empty{margin:16vh auto}.empty h2{font-size:37px}}@media(min-width:761px){.mobile{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span><span class="mark">R</span>FREE AI ROCK</span><button class="icon" id="close" aria-label="Close history">×</button></div><button class="new" id="new">＋ New chat</button><label class="search">⌕<input id="search" aria-label="Search conversations" placeholder="Search chats"></label><div class="history" id="history"></div><div class="foot"><button class="settings" id="settings">⚙ Settings</button></div></aside><main class="main"><header class="top"><div class="left"><button class="icon mobile" id="open" aria-label="Open history">☰</button><h1 id="title">New conversation</h1><label class="model">Model <select id="model"><option>gemini-1.5-flash</option><option>gpt-4o-mini</option><option>llama-3.1-8b-instant</option></select></label></div><div class="actions"><button class="ghost" id="rename" aria-label="Rename chat">✎</button><button class="ghost" id="topSettings" aria-label="Open settings">⚙</button></div></header><section class="messages" id="messages" aria-live="polite"></section><div class="composer-wrap"><div class="status" id="status"></div><form class="composer" id="form"><textarea id="prompt" aria-label="Message FREE AI ROCK" placeholder="Ask anything..."></textarea><div class="composer-row"><span class="hint">Enter to send · Shift+Enter for newline</span><button class="send" id="send">Send ↑</button></div></form></div></main></div><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><h2>Workspace settings</h2><button class="icon" id="closeSettings" aria-label="Close settings">×</button></div><div class="group"><b>Appearance</b><div class="field"><label for="theme">Theme</label><select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></div></div><div class="group"><b>AI provider</b><div class="field"><label for="endpoint">Endpoint</label><input id="endpoint" placeholder="https://api.openai.com/v1/chat/completions"></div><div class="field"><label for="key">API key, stored locally</label><input id="key" type="password"></div><p style="color:var(--muted);font-size:12px">Keys stay in this browser and are sent only to your configured endpoint.</p></div><div class="group"><b>Data</b><div class="field"><label>Backup</label><button class="secondary" id="export" type="button">Export JSON</button></div><div class="field"><label>Reset</label><button class="secondary" id="clear" type="button">Delete all chats</button></div></div><div class="dialog-actions"><button class="secondary" id="cancel" type="button">Cancel</button><button class="primary" id="saveSettings" type="button">Save settings</button></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),CHAT='free-ai-rock-chats',CFG='free-ai-rock-config';let chats=JSON.parse(localStorage.getItem(CHAT)||'[]'),cfg=JSON.parse(localStorage.getItem(CFG)||'{"endpoint":"","apiKey":"","theme":"system"}'),id=null,controller=null;
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36),active=()=>chats.find(c=>c.id===id),save=()=>localStorage.setItem(CHAT,JSON.stringify(chats)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),md=s=>esc(s).replace(/```([\\s\\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1</strong>').replace(/\\n/g,'<br>');
function status(x,error=false){$('#status').textContent=x;$('#status').className='status'+(error?' error':'')}function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function history(){let q=$('#search').value.toLowerCase();$('#history').innerHTML='';let list=chats.filter(c=>c.title.toLowerCase().includes(q));if(!list.length){$('#history').innerHTML='<p style="color:var(--muted);padding:8px">No conversations yet.</p>';return}list.forEach(c=>{let b=document.createElement('button');b.className='chat '+(c.id===id?'active':'');b.innerHTML='<span>◇</span><span>'+esc(c.title)+'</span><span class="del">×</span>';b.onclick=e=>{if(e.target.classList.contains('del')){chats=chats.filter(x=>x.id!==c.id);if(id===c.id)id=null;save();draw();history();return}id=c.id;draw();history();$('#sidebar').classList.remove('open')};$('#history').append(b)})}
function draw(){let c=active();$('#title').textContent=c?.title||'New conversation';let box=$('#messages');box.innerHTML='';if(!c||!c.messages.length){box.innerHTML='<div class="empty"><div class="eyebrow">Powerful AI. Simple experience.</div><h2>Ask better questions.<br>Build better things.</h2><p>Connect a provider in Settings, then start a conversation.</p><div class="suggestions"><button class="suggestion">Explain a complex idea</button><button class="suggestion">Review my code</button><button class="suggestion">Plan a project</button></div></div>';box.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('#prompt').value=b.textContent;$('#prompt').focus()});return}c.messages.forEach((m,i)=>{let r=document.createElement('article');r.className='message '+m.role;r.innerHTML=(m.role==='assistant'?'<div class="avatar">R</div>':'')+'<div><div class="bubble">'+md(m.content)+'</div>'+(m.role==='assistant'?'<div class="tools"><button data-copy="'+i+'">Copy</button><button data-retry="'+i+'">Regenerate</button></div>':'')+'</div>';box.append(r)});box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(c.messages[+b.dataset.copy].content).then(()=>toast('Copied')));box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>send(c.messages[+b.dataset.retry-1]?.content||'',true))}
function newChat(){id=null;draw();history();$('#prompt').focus()}function ensure(text){if(!id){let c={id:uid(),title:text.slice(0,42)+(text.length>42?'…':''),messages:[],createdAt:Date.now()};chats.unshift(c);id=c.id}return active()}
async function send(text,retry=false){if(controller||!text.trim())return;let c=ensure(text);if(!retry)c.messages.push({role:'user',content:text});else c.messages=c.messages.slice(0,-1);let answer={role:'assistant',content:''};c.messages.push(answer);$('#prompt').value='';draw();history();controller=new AbortController();$('#send').textContent='Stop ■';$('#send').classList.add('stop');status('Generating…');try{if(!cfg.apiKey)throw Error('Add an API key and endpoint in Settings first.');let r=await fetch(cfg.endpoint||'https://api.openai.com/v1/chat/completions',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:$('#model').value,messages:c.messages.filter(m=>m.content).map(m=>({role:m.role,content:m.content})),stream:true})});if(!r.ok)throw Error('Provider returned '+r.status+'. Check your key, model, or endpoint.');let reader=r.body?.getReader(),decoder=new TextDecoder(),buffer='';if(!reader)throw Error('Provider did not return a readable stream.');while(true){let {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop();for(let line of lines){if(!line.startsWith('data:'))continue;let payload=line.slice(5).trim();if(payload==='[DONE]')break;try{let d=JSON.parse(payload),delta=d.choices?.[0]?.delta?.content||d.candidates?.[0]?.content?.parts?.[0]?.text||'';if(delta){answer.content+=delta;draw()}}catch{}}}status('');}catch(e){if(e.name==='AbortError'){status('Generation stopped')}else{answer.content='Could not generate a response. '+e.message;status('Provider error',true)}}finally{controller=null;$('#send').textContent='Send ↑';$('#send').classList.remove('stop');save();draw();history()}}
$('#form').onsubmit=e=>{e.preventDefault();if(controller)controller.abort();else send($('#prompt').value)};$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};$('#new').onclick=newChat;$('#search').oninput=history;$('#open').onclick=()=>$('#sidebar').classList.add('open');$('#close').onclick=()=>$('#sidebar').classList.remove('open');function openSettings(){ $('#endpoint').value=cfg.endpoint;$('#key').value=cfg.apiKey;$('#theme').value=cfg.theme;$('#modal').classList.add('open')}$('#settings').onclick=$('#topSettings').onclick=openSettings;$('#closeSettings').onclick=$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#saveSettings').onclick=()=>{cfg={endpoint:$('#endpoint').value.trim(),apiKey:$('#key').value.trim(),theme:$('#theme').value};localStorage.setItem(CFG,JSON.stringify(cfg));applyTheme();$('#modal').classList.remove('open');toast('Settings saved locally')};$('#theme').onchange=applyTheme;function applyTheme(){let t=cfg.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):cfg.theme;document.documentElement.dataset.theme=t}$('#rename').onclick=()=>{let c=active();if(!c)return;let n=prompt('Conversation name',c.title);if(n?.trim()){c.title=n.trim();save();draw();history()}};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chats,null,2)],{type:'application/json'}));a.download='free-ai-rock-chats.json';a.click()};$('#clear').onclick=()=>{if(confirm('Delete all saved conversations?')){chats=[];id=null;save();draw();history();$('#modal').classList.remove('open')}};applyTheme();history();draw();
</script></body></html>
