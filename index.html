<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="FREE AI ROCK, a private multi-provider AI chat workspace.">
<title>FREE AI ROCK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{color-scheme:dark;--bg:oklch(15% .018 250);--panel:oklch(19% .02 250);--panel-2:oklch(22% .025 250);--line:oklch(34% .03 250);--text:oklch(93% .015 250);--muted:oklch(69% .025 250);--accent:oklch(76% .13 190);--accent-2:oklch(68% .16 190);--danger:oklch(70% .16 28);--good:oklch(78% .14 150);--radius:18px;--mono:'Space Mono',monospace;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{height:100dvh;display:grid;grid-template-columns:296px minmax(0,1fr);background:radial-gradient(circle at 82% 0%,oklch(27% .045 190 / .22),transparent 32%),var(--bg)}.sidebar{border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:20px;background:oklch(16% .02 250 / .82);backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}.brand-mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.03em}.mark{width:30px;height:30px;border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-size:12px;box-shadow:0 0 24px oklch(76% .13 190 / .18)}.icon-btn,.ghost-btn{border:1px solid transparent;background:transparent;color:var(--muted);min-width:42px;min-height:42px;border-radius:12px}.icon-btn:hover,.ghost-btn:hover{background:var(--panel-2);color:var(--text)}.new-chat{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}.new-chat:hover{border-color:var(--accent);color:var(--accent)}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:11px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history-label{font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:4px 8px 8px}.chat-item{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;padding:10px 10px;text-align:left}.chat-item:hover,.chat-item.active{background:var(--panel);color:var(--text);border-color:var(--line)}.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.chat-delete{opacity:0}.chat-item:hover .chat-delete{opacity:1}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.settings-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;text-align:left}.settings-link:hover{background:var(--panel);color:var(--text)}.main{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,56px);gap:20px;background:oklch(15% .018 250 / .72);backdrop-filter:blur(18px)}.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}.topbar h1{font-size:17px;margin:0;white-space:nowrap}.model-picker{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.model-picker select{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:10px}.topbar-actions{display:flex;gap:6px}.mobile-only{display:none}.messages{overflow:auto;padding:clamp(22px,5vw,72px) clamp(16px,7vw,120px) 28px;display:flex;flex-direction:column;gap:28px}.empty{margin:auto;max-width:600px;text-align:center}.empty .eyebrow{font:11px var(--mono);color:var(--accent);letter-spacing:.15em;text-transform:uppercase}.empty h2{font-size:clamp(28px,4vw,52px);line-height:1.02;letter-spacing:-.06em;margin:16px 0}.empty p{color:var(--muted);line-height:1.6;max-width:48ch;margin:auto}.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:24px}.suggestion{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:10px 13px}.suggestion:hover{border-color:var(--accent);color:var(--text)}.message{max-width:780px;width:100%;margin:0 auto;display:flex;gap:13px;animation:enter .3s cubic-bezier(.16,1,.3,1)}.message.user{justify-content:flex-end}.message.user .bubble{background:var(--accent);color:oklch(18% .03 190);border-radius:18px 18px 5px 18px}.message.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 5px}.avatar{width:32px;height:32px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font:11px var(--mono);color:var(--accent);background:oklch(76% .13 190 / .10);border:1px solid oklch(76% .13 190 / .28)}.bubble{padding:14px 16px;line-height:1.65;min-width:0}.bubble p{margin:0 0 12px}.bubble p:last-child{margin-bottom:0}.bubble pre{overflow:auto;background:oklch(12% .018 250);padding:14px;border-radius:12px;font:13px var(--mono);white-space:pre-wrap}.bubble code{font-family:var(--mono);font-size:.9em}.message-tools{display:flex;gap:4px;margin-top:8px}.message-tools button{background:transparent;border:0;color:var(--muted);font-size:12px;padding:4px 7px;border-radius:7px}.message-tools button:hover{background:var(--panel-2);color:var(--text)}.composer-wrap{padding:0 clamp(16px,7vw,120px) max(20px,env(safe-area-inset-bottom));}.composer{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:10px;box-shadow:0 16px 60px oklch(8% .02 250 / .30)}.composer textarea{display:block;width:100%;resize:none;min-height:52px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text);padding:8px 9px;line-height:1.5}.composer-row{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 0}.composer-meta{color:var(--muted);font-size:12px}.send{border:0;border-radius:12px;background:var(--accent);color:oklch(18% .03 190);padding:10px 15px;font-weight:700}.send:hover{background:var(--accent-2)}.send:disabled{opacity:.45;cursor:not-allowed}.status{min-height:18px;color:var(--muted);font-size:12px;padding:0 4px 8px}.offline{color:var(--danger)}.modal-backdrop{position:fixed;inset:0;background:oklch(8% .02 250 / .68);display:none;place-items:center;padding:18px;z-index:5}.modal-backdrop.open{display:grid}.modal{width:min(620px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h3{margin:0;font-size:22px}.setting-group{border-top:1px solid var(--line);padding:18px 0}.setting-group:first-of-type{margin-top:18px}.setting-row{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:12px 0}.setting-row label{color:var(--muted);font-size:14px}.setting-row input,.setting-row select{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-width:220px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.primary{background:var(--accent);color:oklch(18% .03 190);border:0;border-radius:11px;padding:10px 14px;font-weight:700}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 14px}.toast{position:fixed;right:20px;bottom:20px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;display:none;z-index:8}.toast.show{display:block;animation:enter .25s ease-out}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:760px){body{overflow:hidden}.shell{display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:4;transform:translateX(-102%);transition:transform .25s cubic-bezier(.16,1,.3,1);box-shadow:24px 0 70px oklch(5% .02 250 / .4)}.sidebar.open{transform:none}.mobile-only{display:inline-grid}.topbar{padding:0 14px}.topbar h1{font-size:15px}.model-picker{display:none}.messages{padding:24px 14px}.composer-wrap{padding:0 14px max(12px,env(safe-area-inset-bottom))}.message{max-width:100%}.empty h2{font-size:36px}.topbar-actions .ghost-btn:not(.mobile-only){display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Chat history">
  <div class="brand"><div class="brand-mark"><span class="mark">R</span> FREE AI ROCK</div><button class="icon-btn" id="closeSidebar" aria-label="Close chat history">×</button></div>
  <button class="new-chat" id="newChat">＋ New chat</button>
  <label class="search" aria-label="Search conversations"><span>⌕</span><input id="search" placeholder="Search chats" autocomplete="off"></label>
  <div class="history" id="history"></div>
  <div class="sidebar-foot"><button class="settings-link" id="openSettings">⚙ Settings</button></div>
</aside>
<main class="main">
  <header class="topbar"><div class="topbar-left"><button class="icon-btn mobile-only" id="openSidebar" aria-label="Open chat history">☰</button><h1 id="chatTitle">New conversation</h1><label class="model-picker">Model <select id="modelSelect"><option value="gemini-1.5-flash">Gemini 1.5 Flash</option><option value="gpt-4o-mini">GPT-4o mini</option><option value="llama-3.1-8b-instant">Llama 3.1 8B</option></select></label></div><div class="topbar-actions"><button class="ghost-btn" id="renameChat" aria-label="Rename conversation">✎</button><button class="ghost-btn" id="topSettings" aria-label="Open settings">⚙</button></div></header>
  <section class="messages" id="messages" aria-live="polite"></section>
  <div class="composer-wrap"><div class="status" id="status"></div><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Ask anything..." aria-label="Message FREE AI ROCK"></textarea><div class="composer-row"><span class="composer-meta">Enter to send · Shift+Enter for a new line</span><button class="send" id="send" type="submit">Send ↑</button></div></form></div>
</main>
</div>
<div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal"><div class="modal-head"><h3 id="settingsTitle">Workspace settings</h3><button class="icon-btn" id="closeSettings" aria-label="Close settings">×</button></div><div class="setting-group"><strong>Appearance</strong><div class="setting-row"><label for="theme">Theme</label><select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></div></div><div class="setting-group"><strong>AI provider</strong><div class="setting-row"><label for="endpoint">OpenAI-compatible endpoint</label><input id="endpoint" placeholder="https://api.openai.com/v1/chat/completions"></div><div class="setting-row"><label for="apiKey">API key, stored locally</label><input id="apiKey" type="password" placeholder="sk-..."></div><p style="color:var(--muted);font-size:12px;line-height:1.5">Keys stay in this browser's local storage. They are sent only to the endpoint you configure. Never commit them to GitHub.</p></div><div class="setting-group"><strong>Data</strong><div class="setting-row"><label>Conversation backup</label><button class="secondary" id="exportChats" type="button">Export JSON</button></div><div class="setting-row"><label>Reset local workspace</label><button class="secondary" id="clearChats" type="button">Delete all chats</button></div></div><div class="modal-actions"><button class="secondary" id="cancelSettings" type="button">Cancel</button><button class="primary" id="saveSettings" type="button">Save settings</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);const storeKey='free-ai-rock-chats';const configKey='free-ai-rock-config';
let chats=JSON.parse(localStorage.getItem(storeKey)||'[]');let config=JSON.parse(localStorage.getItem(configKey)||'{"endpoint":"","apiKey":"","theme":"dark"}');let currentId=null;let generating=false;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36);const save=()=>localStorage.setItem(storeKey,JSON.stringify(chats));const active=()=>chats.find(c=>c.id===currentId);const escapeHtml=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function markdown(s){let safe=escapeHtml(s);safe=safe.replace(/```([\\s\\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1</strong>').replace(/\\n/g,'<br>');return safe}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function renderHistory(){const q=$('#search').value.toLowerCase();$('#history').innerHTML='';const visible=chats.filter(c=>c.title.toLowerCase().includes(q));if(!visible.length){$('#history').innerHTML='<div style="padding:16px 8px;color:var(--muted);font-size:13px">No conversations yet.</div>';return}visible.forEach(c=>{const b=document.createElement('button');b.className='chat-item '+(c.id===currentId?'active':'');b.innerHTML='<span>◇</span><span class="chat-title">'+escapeHtml(c.title)+'</span><span class="chat-delete" aria-label="Delete conversation">×</span>';b.onclick=e=>{if(e.target.classList.contains('chat-delete')){chats=chats.filter(x=>x.id!==c.id);if(currentId===c.id)startNew();save();renderHistory();return}currentId=c.id;render();renderHistory();$('#sidebar').classList.remove('open')};$('#history').appendChild(b)})}
function render(){const c=active();$('#chatTitle').textContent=c?.title||'New conversation';const box=$('#messages');box.innerHTML='';if(!c||!c.messages.length){box.innerHTML='<div class="empty"><div class="eyebrow">Powerful AI. Simple experience.</div><h2>Ask better questions.<br>Build better things.</h2><p>FREE AI ROCK is your private chat workspace. Connect a provider in Settings, then start a conversation.</p><div class="suggestions"><button class="suggestion">Explain a complex idea</button><button class="suggestion">Review my code</button><button class="suggestion">Plan a project</button></div></div>';document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('#prompt').value=b.textContent;$('#prompt').focus()});return}c.messages.forEach((m,i)=>{const row=document.createElement('article');row.className='message '+m.role;row.innerHTML=(m.role==='assistant'?'<div class="avatar">R</div>':'')+'<div><div class="bubble">'+markdown(m.content)+'</div>'+(m.role==='assistant'?'<div class="message-tools"><button data-copy="'+i+'">Copy</button><button data-regenerate="'+i+'">Regenerate</button></div>':'')+'</div>';box.appendChild(row)});box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(c.messages[+b.dataset.copy].content).then(()=>toast('Copied to clipboard')));box.querySelectorAll('[data-regenerate]').forEach(b=>b.onclick=()=>sendMessage(c.messages[+b.dataset.regenerate-1]?.content||'',true))}
function startNew(){currentId=null;render();renderHistory();$('#prompt').focus()}
function ensureChat(text){if(!currentId){const c={id:uid(),title:text.slice(0,42)+(text.length>42?'…':''),messages:[],createdAt:Date.now()};chats.unshift(c);currentId=c.id}return active()}
async function sendMessage(text,regenerate=false){if(generating)return;if(!text.trim())return;const c=ensureChat(text);if(!regenerate)c.messages.push({role:'user',content:text});else c.messages=c.messages.slice(0,-1);c.messages.push({role:'assistant',content:''});generating=true;$('#send').textContent='Stop ■';$('#send').onclick=()=>{generating=false;$('#status').textContent='Generation stopped';};$('#prompt').value='';render();renderHistory();const last=c.messages[c.messages.length-2]?.content||text;try{const endpoint=config.endpoint||'https://api.openai.com/v1/chat/completions';if(!config.apiKey)throw new Error('Add an API key and endpoint in Settings first.');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.apiKey},body:JSON.stringify({model:$('#modelSelect').value,messages:c.messages.filter(m=>m.content).map(m=>({role:m.role,content:m.content})),stream:false})});if(!response.ok)throw new Error('Provider returned '+response.status+'. Check your key, model, or endpoint.');const data=await response.json();const answer=data.choices?.[0]?.message?.content||data.candidates?.[0]?.content?.parts?.[0]?.text;if(!answer)throw new Error('The provider returned no text.');c.messages[c.messages.length-1].content=answer;$('#status').textContent='';}catch(e){c.messages[c.messages.length-1].content='Could not generate a response. '+e.message;$('#status').textContent='Provider error';$('#status').classList.add('offline')}finally{generating=false;$('#send').textContent='Send ↑';$('#send').onclick=null;save();render();renderHistory()}}
$('#composer').onsubmit=e=>{e.preventDefault();sendMessage($('#prompt').value)};$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});$('#newChat').onclick=startNew;$('#search').oninput=renderHistory;$('#openSidebar').onclick=()=>$('#sidebar').classList.add('open');$('#closeSidebar').onclick=()=>$('#sidebar').classList.remove('open');$('#openSettings').onclick=$('#topSettings').onclick=()=>{$('#settingsModal').classList.add('open');$('#endpoint').value=config.endpoint;$('#apiKey').value=config.apiKey;$('#theme').value=config.theme};$('#closeSettings').onclick=$('#cancelSettings').onclick=()=>$('#settingsModal').classList.remove('open');$('#saveSettings').onclick=()=>{config={endpoint:$('#endpoint').value.trim(),apiKey:$('#apiKey').value.trim(),theme:$('#theme').value};localStorage.setItem(configKey,JSON.stringify(config));$('#settingsModal').classList.remove('open');toast('Settings saved locally')};$('#renameChat').onclick=()=>{const c=active();if(!c)return;const name=prompt('Conversation name',c.title);if(name?.trim()){c.title=name.trim();save();render();renderHistory()}};$('#exportChats').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chats,null,2)],{type:'application/json'}));a.download='free-ai-rock-chats.json';a.click()};$('#clearChats').onclick=()=>{if(confirm('Delete all saved conversations?')){chats=[];currentId=null;save();render();renderHistory();$('#settingsModal').classList.remove('open')}};$('#modelSelect').onchange=()=>toast('Model set to '+$('#modelSelect').selectedOptions[0].text);renderHistory();render();
</script>
</body>
</html>
